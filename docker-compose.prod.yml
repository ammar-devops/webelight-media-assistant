services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ai-media-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    expose:
      - "8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/output:/app/output
      - ./backend/database:/app/database

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - ai-media-network
      - reverse-proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ai-media-frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "3000:80"

    networks:
      - ai-media-network
      - reverse-proxy

networks:
  ai-media-network:
    driver: bridge

  reverse-proxy:
    external: true
