services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ai-media-assistant-backend
    container_name: ai-media-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - ai-media-network
      - reverse-proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: ai-media-assistant-frontend
    container_name: ai-media-frontend

    ports:
      - "8082:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - ai-media-network
      - reverse-proxy

networks:
  ai-media-network:
    driver: bridge

  reverse-proxy:
    external: true
